services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/overvault.db
      STORAGE_DIR: /data/storage
    volumes:
      - overvault-data:/data
    ports:
      - "8000:8000"
  # frontend: added by Pavan (Next.js on :3000)
volumes:
  overvault-data:
