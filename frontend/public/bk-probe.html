<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BridgeKey API Probe — OverVault Dev</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0b0f17; color: #e7eaf3; padding: 24px; }
    h1 { font-size: 18px; font-weight: 600; color: #7c83ff; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #8b95ad; margin-bottom: 24px; }
    .section { margin-bottom: 20px; }
    .section-title { font-size: 13px; font-weight: 600; color: #fdb022; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .result-box { background: #121826; border: 1px solid #26304a; border-radius: 8px; padding: 12px 14px; font-family: 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }
    .ok    { color: #32d583; }
    .warn  { color: #fdb022; }
    .fail  { color: #f97066; }
    .muted { color: #8b95ad; }
    .label { color: #53b1fd; }
    .value { color: #e7eaf3; }
    button { background: #7c83ff; color: #fff; border: none; border-radius: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer; margin-top: 16px; }
    button:hover { background: #9aa0ff; }
    #copy-btn { background: #26304a; color: #8b95ad; font-size: 11px; padding: 5px 12px; }
    #copy-btn:hover { background: #32d583; color: #0b0f17; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
    .badge-ok   { background: rgba(50,213,131,.2); color: #32d583; }
    .badge-warn { background: rgba(253,176,34,.2);  color: #fdb022; }
    .badge-fail { background: rgba(249,112,102,.2); color: #f97066; }
  </style>
</head>
<body>
  <h1>BridgeKey API Probe <span id="overall-badge"></span></h1>
  <p class="subtitle">OverVault — Phase 2 BridgeKey integration investigation. Open this file in the same browser where BridgeKey is installed.</p>

  <div id="output">
    <p class="muted">Running probes…</p>
  </div>

  <button onclick="runProbes()">🔄 Re-run probes</button>
  <button id="copy-btn" onclick="copyResults()">📋 Copy results for Pannaga</button>

  <script>
    const results = {};

    function fmt(v) {
      if (v === undefined) return '<span class="muted">undefined</span>';
      if (v === null)      return '<span class="muted">null</span>';
      if (typeof v === 'boolean') return `<span class="${v ? 'ok' : 'fail'}">${v}</span>`;
      if (typeof v === 'string')  return `<span class="value">"${v}"</span>`;
      return `<span class="value">${JSON.stringify(v, null, 2)}</span>`;
    }

    function row(label, value, status) {
      const cls = status === 'ok' ? 'ok' : status === 'warn' ? 'warn' : status === 'fail' ? 'fail' : 'muted';
      return `<span class="label">${label.padEnd(32)}</span>${fmt(value)}\n`;
    }

    async function runProbes() {
      const out = document.getElementById('output');
      out.innerHTML = '<p class="muted">Running…</p>';

      const sections = [];

      // ── BK-1 / BK-2: Provider discovery ─────────────────────────────────
      {
        const s = { title: 'BK-1 / BK-2 — Provider discovery & installation', lines: [] };

        const hasEthereum  = typeof window.ethereum  !== 'undefined';
        const hasBridgekey = typeof window.bridgekey !== 'undefined';
        const hasMst       = typeof window.mst       !== 'undefined';
        const hasWeb3      = typeof window.web3      !== 'undefined';

        s.lines.push(row('window.ethereum present', hasEthereum,  hasEthereum  ? 'ok' : 'fail'));
        s.lines.push(row('window.bridgekey present', hasBridgekey, hasBridgekey ? 'ok' : 'fail'));
        s.lines.push(row('window.mst present',       hasMst,       hasMst       ? 'ok' : 'fail'));
        s.lines.push(row('window.web3 present',      hasWeb3,      hasWeb3      ? 'ok' : 'fail'));

        // Scan window for any wallet-related keys
        const walletKeys = Object.keys(window).filter(k =>
          /bridge|wallet|mst|ether|web3|chain|provider/i.test(k)
        );
        s.lines.push(row('window wallet-related keys', walletKeys.join(', ') || '(none)', walletKeys.length ? 'ok' : 'warn'));

        results['BK-1'] = { hasEthereum, hasBridgekey, hasMst, hasWeb3, walletKeys };
        sections.push(s);
      }

      // ── window.ethereum deep inspect ─────────────────────────────────────
      {
        const s = { title: 'window.ethereum — Deep inspection', lines: [] };

        if (window.ethereum) {
          const e = window.ethereum;
          const flags = {
            isMetaMask:      e.isMetaMask,
            isBridgeKey:     e.isBridgeKey,
            isCoinbaseWallet:e.isCoinbaseWallet,
            isTrust:         e.isTrust,
            isRabby:         e.isRabby,
            chainId:         e.chainId,
            networkVersion:  e.networkVersion,
            selectedAddress: e.selectedAddress,
            has_request:     typeof e.request === 'function',
            has_send:        typeof e.send === 'function',
            has_sendAsync:   typeof e.sendAsync === 'function',
            has_on:          typeof e.on === 'function',
            has_removeListener: typeof e.removeListener === 'function',
            has_enable:      typeof e.enable === 'function',
            constructor:     e.constructor?.name,
          };
          for (const [k, v] of Object.entries(flags)) {
            const st = typeof v === 'boolean' ? (v ? 'ok' : 'warn') : (v !== undefined && v !== null ? 'ok' : 'muted');
            s.lines.push(row(k, v, st));
          }

          // All own keys
          try {
            const ownKeys = Object.keys(e).slice(0, 60);
            s.lines.push(row('own keys (up to 60)', ownKeys, ownKeys.length ? 'ok' : 'warn'));
          } catch {}

          // Prototype keys
          try {
            const protoKeys = Object.getOwnPropertyNames(Object.getPrototypeOf(e)).slice(0, 40);
            s.lines.push(row('prototype keys (up to 40)', protoKeys, 'muted'));
          } catch {}

          // providers array (EIP-6963 / multi-wallet)
          if (Array.isArray(e.providers)) {
            s.lines.push(row('providers array length', e.providers.length, 'ok'));
            e.providers.forEach((p, i) => {
              s.lines.push(row(`  providers[${i}].isBridgeKey`, p.isBridgeKey, 'ok'));
              s.lines.push(row(`  providers[${i}].isMetaMask`, p.isMetaMask, 'ok'));
              s.lines.push(row(`  providers[${i}].chainId`, p.chainId, 'ok'));
            });
          }

          results['ethereum_details'] = flags;
        } else {
          s.lines.push('<span class="fail">window.ethereum is undefined — BridgeKey may not inject a provider on this page, or is not installed.</span>\n');
          results['ethereum_details'] = null;
        }

        sections.push(s);
      }

      // ── BK-4: Chain ID ──────────────────────────────────────────────────
      {
        const s = { title: 'BK-4 — Chain / Network identification', lines: [] };

        if (window.ethereum?.request) {
          try {
            const chainId = await window.ethereum.request({ method: 'eth_chainId' });
            s.lines.push(row('eth_chainId (hex)', chainId, 'ok'));
            s.lines.push(row('eth_chainId (decimal)', parseInt(chainId, 16), 'ok'));
            results['chainId'] = chainId;
          } catch(e) {
            s.lines.push(row('eth_chainId error', `code=${e.code} msg=${e.message}`, 'fail'));
            results['chainId'] = { error: e.message, code: e.code };
          }

          try {
            const netVer = await window.ethereum.request({ method: 'net_version' });
            s.lines.push(row('net_version', netVer, 'ok'));
            results['netVersion'] = netVer;
          } catch(e) {
            s.lines.push(row('net_version error', `code=${e.code} msg=${e.message}`, 'warn'));
          }
        } else {
          s.lines.push('<span class="warn">window.ethereum.request not available — cannot query chain ID\n</span>');
        }

        sections.push(s);
      }

      // ── BK-3: Accounts ──────────────────────────────────────────────────
      {
        const s = { title: 'BK-3 — Account access (eth_accounts — no prompt)', lines: [] };

        if (window.ethereum?.request) {
          try {
            // eth_accounts reads already-authorized accounts — does NOT prompt
            const accounts = await window.ethereum.request({ method: 'eth_accounts' });
            s.lines.push(row('eth_accounts result', accounts, accounts.length ? 'ok' : 'warn'));
            s.lines.push(row('accounts count', accounts.length, accounts.length ? 'ok' : 'warn'));
            if (accounts.length) {
              s.lines.push(row('first account (public)', accounts[0], 'ok'));
            }
            results['accounts'] = accounts;
          } catch(e) {
            s.lines.push(row('eth_accounts error', `code=${e.code} msg=${e.message}`, 'fail'));
            results['accounts'] = { error: e.message, code: e.code };
          }
        } else {
          s.lines.push('<span class="warn">window.ethereum.request not available\n</span>');
        }

        // BK-3 note: eth_requestAccounts WOULD prompt — not running that automatically
        s.lines.push('<span class="muted">Note: eth_requestAccounts (prompts user) not run automatically.\nClick "Request accounts" below if you want to test the connect prompt.\n</span>');
        sections.push(s);
      }

      // ── BK-7: Error code detection ──────────────────────────────────────
      {
        const s = { title: 'BK-7 — Error code detection (call with bad method)', lines: [] };

        if (window.ethereum?.request) {
          try {
            await window.ethereum.request({ method: 'eth_nonExistentMethod_probe_12345' });
            s.lines.push('<span class="warn">No error thrown — unexpected\n</span>');
          } catch(e) {
            s.lines.push(row('error.code', e.code, 'ok'));
            s.lines.push(row('error.message', e.message, 'ok'));
            s.lines.push(row('error constructor', e.constructor?.name, 'muted'));
            s.lines.push('<span class="muted">EIP-1193 user rejection code is 4001 (this probe tests a different code)\n</span>');
            results['errorShape'] = { code: e.code, message: e.message, constructor: e.constructor?.name };
          }
        } else {
          s.lines.push('<span class="warn">window.ethereum.request not available\n</span>');
        }

        sections.push(s);
      }

      // ── BK-8: Events ─────────────────────────────────────────────────────
      {
        const s = { title: 'BK-8 — Event system', lines: [] };

        if (window.ethereum?.on) {
          s.lines.push('<span class="ok">window.ethereum.on is available ✓\n</span>');
          s.lines.push('<span class="muted">Standard EIP-1193 events: accountsChanged, chainChanged, disconnect\nListening for 3 seconds to detect any immediate events…\n</span>');

          const events = [];
          const handlers = {};
          ['accountsChanged', 'chainChanged', 'disconnect', 'connect', 'message'].forEach(ev => {
            handlers[ev] = (...args) => events.push({ ev, args: JSON.stringify(args).slice(0, 200) });
            window.ethereum.on(ev, handlers[ev]);
          });

          await new Promise(r => setTimeout(r, 3000));

          ['accountsChanged', 'chainChanged', 'disconnect', 'connect', 'message'].forEach(ev => {
            window.ethereum.removeListener?.(ev, handlers[ev]);
          });

          if (events.length === 0) {
            s.lines.push('<span class="muted">No events fired in 3 seconds (expected in idle state)\n</span>');
          } else {
            events.forEach(e => s.lines.push(row(`event: ${e.ev}`, e.args, 'ok')));
          }

          results['events'] = events;
        } else {
          s.lines.push('<span class="fail">window.ethereum.on not available\n</span>');
          results['events'] = null;
        }

        sections.push(s);
      }

      // ── Summary ──────────────────────────────────────────────────────────
      {
        const e = window.ethereum;
        const isEIP1193 = e && typeof e.request === 'function' && typeof e.on === 'function';

        const s = { title: '── SUMMARY ──', lines: [] };
        s.lines.push(row('Provider found at', e ? 'window.ethereum' : '(none)', e ? 'ok' : 'fail'));
        s.lines.push(row('EIP-1193 compatible', isEIP1193, isEIP1193 ? 'ok' : 'fail'));
        s.lines.push(row('Identified as BridgeKey', !!e?.isBridgeKey, e?.isBridgeKey ? 'ok' : 'warn'));
        s.lines.push(row('Chain ID', results.chainId ?? 'unknown', results.chainId && !results.chainId.error ? 'ok' : 'fail'));
        s.lines.push(row('Accounts (pre-auth)', results.accounts?.length ? results.accounts[0] : '(none/not connected)', results.accounts?.length ? 'ok' : 'warn'));
        s.lines.push(row('BK-1 resolved', e ? 'window.ethereum' : 'UNRESOLVED', e ? 'ok' : 'fail'));
        s.lines.push(row('BK-2 resolved', e ? 'typeof window.ethereum !== undefined' : 'UNRESOLVED', e ? 'ok' : 'fail'));
        s.lines.push(row('BK-3 resolved', isEIP1193 ? 'eth_requestAccounts' : 'UNRESOLVED', isEIP1193 ? 'ok' : 'fail'));
        s.lines.push(row('BK-4 resolved', results.chainId && !results.chainId?.error ? results.chainId : 'UNRESOLVED', results.chainId && !results.chainId?.error ? 'ok' : 'fail'));
        s.lines.push(row('BK-5 resolved', isEIP1193 ? 'personal_sign (EIP-191)' : 'UNRESOLVED', isEIP1193 ? 'ok' : 'fail'));
        s.lines.push(row('BK-6 resolved', isEIP1193 ? 'eth_sendTransaction' : 'UNRESOLVED', isEIP1193 ? 'ok' : 'fail'));
        s.lines.push(row('BK-7 resolved', results.errorShape?.code !== undefined ? `code=${results.errorShape.code}` : 'PARTIAL', results.errorShape ? 'warn' : 'fail'));
        s.lines.push(row('BK-8 resolved', e?.on ? 'accountsChanged/chainChanged/disconnect' : 'UNRESOLVED', e?.on ? 'ok' : 'fail'));
        sections.push(s);
      }

      // ── Render ─────────────────────────────────────────────────────────
      let html = '';
      for (const s of sections) {
        html += `<div class="section"><div class="section-title">${s.title}</div><div class="result-box">${s.lines.join('')}</div></div>`;
      }
      out.innerHTML = html;

      // Store plain text for copying
      results.__plainText = sections.map(s =>
        `=== ${s.title} ===\n` + s.lines.map(l => l.replace(/<[^>]+>/g, '')).join('')
      ).join('\n\n');
    }

    function copyResults() {
      navigator.clipboard.writeText(JSON.stringify(results, null, 2))
        .then(() => { document.getElementById('copy-btn').textContent = '✅ Copied!'; setTimeout(() => document.getElementById('copy-btn').textContent = '📋 Copy results for Pannaga', 2000); })
        .catch(() => alert('Copy failed. Open DevTools and run: copy(JSON.stringify(window._bkResults, null, 2))'));
      window._bkResults = results;
    }

    // Auto-run on load
    window.addEventListener('load', () => {
      setTimeout(runProbes, 500); // slight delay to allow extension to inject
    });
  </script>

  <div style="margin-top:32px; padding:16px; background:#121826; border-radius:8px; border:1px solid #26304a;">
    <p style="font-size:12px; color:#8b95ad; margin-bottom:8px;">
      <strong style="color:#fdb022">Manual step — connect prompt test:</strong>
      Click only if you want to test eth_requestAccounts (will prompt BridgeKey popup):
    </p>
    <button onclick="testConnect()" style="background:#26304a; color:#7c83ff; font-size:12px; padding:6px 14px;">
      Test eth_requestAccounts (opens wallet popup)
    </button>
    <div id="connect-result" style="margin-top:8px; font-family:monospace; font-size:12px; color:#8b95ad;"></div>
  </div>

  <script>
    async function testConnect() {
      const el = document.getElementById('connect-result');
      el.textContent = 'Requesting accounts… (check your BridgeKey popup)';
      try {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        el.innerHTML = `<span style="color:#32d583">Connected! Accounts: ${JSON.stringify(accounts)}</span>`;
        window._bkResults = window._bkResults || {};
        window._bkResults.requestAccounts = accounts;
      } catch(e) {
        el.innerHTML = `<span style="color:#f97066">Error — code: ${e.code}, message: ${e.message}</span>`;
        window._bkResults = window._bkResults || {};
        window._bkResults.requestAccountsError = { code: e.code, message: e.message };
      }
    }
  </script>
</body>
</html>
