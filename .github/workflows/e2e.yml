name: e2e
on:
  workflow_dispatch:
  pull_request: { paths: ["e2e/**"] }
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd e2e && npm ci && npx playwright install --with-deps && npx playwright test
