openapi: 3.1.0
info:
  title: OverVault API
  version: 0.1.0
paths:
  /api/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/dev-login:
    post:
      tags:
      - auth
      summary: Dev Login
      operationId: dev_login_api_auth_dev_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - HTTPBearer: []
  /api/auth/wallet/nonce:
    post:
      tags:
      - auth
      summary: Wallet Nonce
      operationId: wallet_nonce_api_auth_wallet_nonce_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletNonceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletNonceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/wallet/verify:
    post:
      tags:
      - auth
      summary: Wallet Verify
      operationId: wallet_verify_api_auth_wallet_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/users:
    get:
      tags:
      - users
      summary: List Users
      operationId: list_users_api_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api Users Get
      security:
      - HTTPBearer: []
  /api/users/{user_id}:
    get:
      tags:
      - users
      summary: Get User
      operationId: get_user_api_users__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files:
    get:
      tags:
      - files
      summary: List Files
      operationId: list_files_api_files_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FileOut'
                type: array
                title: Response List Files Api Files Get
      security:
      - HTTPBearer: []
    post:
      tags:
      - files
      summary: Upload File
      operationId: upload_file_api_files_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_file_api_files_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/files/{file_id}:
    get:
      tags:
      - files
      summary: Get File
      operationId: get_file_api_files__file_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - files
      summary: Delete File
      operationId: delete_file_api_files__file_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/download:
    get:
      tags:
      - files
      summary: Download Current
      operationId: download_current_api_files__file_id__download_get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/protection:
    patch:
      tags:
      - files
      summary: Set Protection
      operationId: set_protection_api_files__file_id__protection_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectionUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/versions:
    get:
      tags:
      - versions
      summary: List Versions
      operationId: list_versions_api_files__file_id__versions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionOut'
                title: Response List Versions Api Files  File Id  Versions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - versions
      summary: Upload Version
      operationId: upload_version_api_files__file_id__versions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_version_api_files__file_id__versions_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/versions/{number}/download:
    get:
      tags:
      - versions
      summary: Download Version
      operationId: download_version_api_files__file_id__versions__number__download_get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/versions/{number}/rollback:
    post:
      tags:
      - versions
      summary: Rollback
      operationId: rollback_api_files__file_id__versions__number__rollback_post
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: number
        in: path
        required: true
        schema:
          type: integer
          title: Number
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RollbackRequest'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/permissions:
    get:
      tags:
      - permissions
      summary: List Permissions
      operationId: list_permissions_api_files__file_id__permissions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Inactive
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionOut'
                title: Response List Permissions Api Files  File Id  Permissions Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - permissions
      summary: Grant Permission
      operationId: grant_permission_api_files__file_id__permissions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/permissions/{permission_id}/revoke:
    post:
      tags:
      - permissions
      summary: Revoke Permission
      operationId: revoke_permission_api_permissions__permission_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: permission_id
        in: path
        required: true
        schema:
          type: string
          title: Permission Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RevokeRequest'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/approvals:
    post:
      tags:
      - approvals
      summary: Submit Approval
      operationId: submit_approval_api_files__file_id__approvals_post
      security:
      - HTTPBearer: []
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalSubmit'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/approvals:
    get:
      tags:
      - approvals
      summary: List Approvals
      operationId: list_approvals_api_approvals_get
      security:
      - HTTPBearer: []
      parameters:
      - name: scope
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ApprovalStatus'
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalOut'
                title: Response List Approvals Api Approvals Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/approvals/{approval_id}:
    get:
      tags:
      - approvals
      summary: Get Approval
      operationId: get_approval_api_approvals__approval_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/approvals/{approval_id}/approve:
    post:
      tags:
      - approvals
      summary: Approve
      operationId: approve_api_approvals__approval_id__approve_post
      security:
      - HTTPBearer: []
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApprovalDecision'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/approvals/{approval_id}/reject:
    post:
      tags:
      - approvals
      summary: Reject
      operationId: reject_api_approvals__approval_id__reject_post
      security:
      - HTTPBearer: []
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
          title: Approval Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/ApprovalDecision'
              - type: 'null'
              title: Body
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dashboard/summary:
    get:
      tags:
      - dashboard
      summary: Summary
      operationId: summary_api_dashboard_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
      security:
      - HTTPBearer: []
components:
  schemas:
    ApprovalDecision:
      properties:
        comment:
          type: string
          title: Comment
          default: ''
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
      type: object
      title: ApprovalDecision
    ApprovalOut:
      properties:
        id:
          type: string
          title: Id
        file_id:
          type: string
          title: File Id
        version_number:
          type: integer
          title: Version Number
        requested_by:
          type: string
          title: Requested By
        reviewer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewer Id
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        request_comment:
          type: string
          title: Request Comment
        decision_comment:
          type: string
          title: Decision Comment
        created_at:
          type: string
          format: date-time
          title: Created At
        decided_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Decided At
      type: object
      required:
      - id
      - file_id
      - version_number
      - requested_by
      - status
      - request_comment
      - decision_comment
      - created_at
      title: ApprovalOut
    ApprovalStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      title: ApprovalStatus
    ApprovalSubmit:
      properties:
        version_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version Number
        comment:
          type: string
          title: Comment
          default: ''
      type: object
      title: ApprovalSubmit
    Body_upload_file_api_files_post:
      properties:
        upload:
          type: string
          contentMediaType: application/octet-stream
          title: Upload
        comment:
          type: string
          title: Comment
          default: ''
      type: object
      required:
      - upload
      title: Body_upload_file_api_files_post
    Body_upload_version_api_files__file_id__versions_post:
      properties:
        upload:
          type: string
          contentMediaType: application/octet-stream
          title: Upload
        comment:
          type: string
          title: Comment
          default: ''
      type: object
      required:
      - upload
      title: Body_upload_version_api_files__file_id__versions_post
    DashboardSummary:
      properties:
        total_files:
          type: integer
          title: Total Files
        total_versions:
          type: integer
          title: Total Versions
        pending_approvals:
          type: integer
          title: Pending Approvals
        active_grants:
          type: integer
          title: Active Grants
        expiring_soon:
          type: integer
          title: Expiring Soon
        protected_files:
          type: integer
          title: Protected Files
        approved_files:
          type: integer
          title: Approved Files
      type: object
      required:
      - total_files
      - total_versions
      - pending_approvals
      - active_grants
      - expiring_soon
      - protected_files
      - approved_files
      title: DashboardSummary
    DevLoginRequest:
      properties:
        email:
          type: string
          title: Email
      type: object
      required:
      - email
      title: DevLoginRequest
    FileOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        content_type:
          type: string
          title: Content Type
        owner_id:
          type: string
          title: Owner Id
        protection_mode:
          $ref: '#/components/schemas/ProtectionMode'
        current_version:
          type: integer
          title: Current Version
        approved_version:
          anyOf:
          - type: integer
          - type: 'null'
          title: Approved Version
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        my_access:
          anyOf:
          - $ref: '#/components/schemas/PermissionLevel'
          - type: 'null'
      type: object
      required:
      - id
      - name
      - content_type
      - owner_id
      - protection_mode
      - current_version
      - created_at
      - updated_at
      title: FileOut
    GrantRequest:
      properties:
        user_id:
          type: string
          title: User Id
        level:
          $ref: '#/components/schemas/PermissionLevel'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
      type: object
      required:
      - user_id
      - level
      title: GrantRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PermissionLevel:
      type: string
      enum:
      - read
      - write
      - manage
      title: PermissionLevel
    PermissionOut:
      properties:
        id:
          type: string
          title: Id
        file_id:
          type: string
          title: File Id
        user_id:
          type: string
          title: User Id
        level:
          $ref: '#/components/schemas/PermissionLevel'
        granted_by:
          type: string
          title: Granted By
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        revoked_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked Reason
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - file_id
      - user_id
      - level
      - granted_by
      - created_at
      title: PermissionOut
    ProtectionMode:
      type: string
      enum:
      - none
      - append_only
      - read_only
      title: ProtectionMode
    ProtectionUpdate:
      properties:
        protection_mode:
          $ref: '#/components/schemas/ProtectionMode'
      type: object
      required:
      - protection_mode
      title: ProtectionUpdate
    RevokeRequest:
      properties:
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
      type: object
      title: RevokeRequest
    Role:
      type: string
      enum:
      - employee
      - manager
      - admin
      - auditor
      title: Role
    RollbackRequest:
      properties:
        comment:
          type: string
          title: Comment
          default: ''
      type: object
      title: RollbackRequest
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        user:
          $ref: '#/components/schemas/UserOut'
      type: object
      required:
      - access_token
      - user
      title: TokenResponse
    UserOut:
      properties:
        id:
          type: string
          title: Id
        email:
          type: string
          title: Email
        name:
          type: string
          title: Name
        role:
          $ref: '#/components/schemas/Role'
        wallet_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet Address
      type: object
      required:
      - id
      - email
