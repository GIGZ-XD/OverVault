openapi: 3.1.0
info:
  title: OverVault API
  version: 0.1.0
# STARTER. Vineeth (with Claude Code) expands this in the Hour 0-2 freeze.
paths:
  /health:
    get: { summary: Health check, responses: { "200": { description: ok } } }
  /auth/dev-login:
    post: { summary: "Dev-mode login (AUTH_MODE=dev)", responses: { "200": { description: JWT } } }
  /auth/nonce:
    post: { summary: Get wallet login nonce, responses: { "200": { description: nonce } } }
  /auth/wallet-login:
    post: { summary: Verify wallet signature and issue JWT, responses: { "200": { description: JWT } } }
  /files:
    get: { summary: List files, responses: { "200": { description: files } } }
    post: { summary: Upload file, responses: { "201": { description: created } } }
  /files/{id}:
    get: { summary: File detail, responses: { "200": { description: file } } }
    delete: { summary: Delete file, responses: { "204": { description: deleted } } }
  /files/{id}/download:
    get: { summary: Download (hash verified), responses: { "200": { description: bytes } } }
  /files/{id}/verify:
    post: { summary: Re-hash and compare with chain, responses: { "200": { description: result } } }
  /files/{id}/protection:
    put: { summary: Set none/read-only/append-only, responses: { "200": { description: ok } } }
  /files/{id}/versions:
    get: { summary: Version history, responses: { "200": { description: versions } } }
    post: { summary: Upload new version, responses: { "201": { description: created } } }
  /files/{id}/versions/{v}/rollback:
    post: { summary: Roll back, responses: { "200": { description: ok } } }
  /files/{id}/permissions:
    get: { summary: List grants, responses: { "200": { description: grants } } }
    post: { summary: Grant access with expiry, responses: { "201": { description: created } } }
  /permissions/{id}:
    delete: { summary: Revoke, responses: { "204": { description: revoked } } }
  /approvals:
    get: { summary: Approval inbox, responses: { "200": { description: list } } }
    post: { summary: Submit change for approval, responses: { "201": { description: created } } }
  /approvals/{id}/decision:
    post: { summary: Approve or reject, responses: { "200": { description: ok } } }
  /audit:
    get: { summary: Audit trail with filters, responses: { "200": { description: events } } }
  /dashboard/summary:
    get: { summary: Dashboard numbers, responses: { "200": { description: summary } } }
